name: yunxia-backend

services:
  postgres:
    image: "${YUNXIA_DOCKER_POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: yunxia-postgres
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      POSTGRES_DB: "${YUNXIA_POSTGRES_DB:-yunxia}"
      POSTGRES_USER: "${YUNXIA_POSTGRES_USER:-yunxia}"
      POSTGRES_PASSWORD: "${YUNXIA_POSTGRES_PASSWORD:-yunxia}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YUNXIA_POSTGRES_USER:-yunxia} -d ${YUNXIA_POSTGRES_DB:-yunxia}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Linux 测试机常用 127.0.0.1 代理；build 期使用 host 网络可让容器内 apt/go 访问宿主机代理。
      # 如目标环境不允许 host build network，可在 .env 中覆盖为 default。
      network: "${YUNXIA_DOCKER_BUILD_NETWORK:-host}"
      args:
        GO_IMAGE: "${YUNXIA_DOCKER_GO_IMAGE:-golang:1.25-bookworm}"
        RUNTIME_IMAGE: "${YUNXIA_DOCKER_RUNTIME_IMAGE:-debian:bookworm-slim}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
        NO_PROXY: "${NO_PROXY:-}"
        no_proxy: "${no_proxy:-}"
    container_name: yunxia-backend
    restart: unless-stopped
    ports:
      - "${YUNXIA_HTTP_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      YUNXIA_SERVER_HOST: "0.0.0.0"
      YUNXIA_SERVER_PORT: "8080"
      YUNXIA_SERVER_MODE: "${YUNXIA_SERVER_MODE:-release}"
      YUNXIA_DATABASE_DSN: "${YUNXIA_DATABASE_DSN:-postgres://${YUNXIA_POSTGRES_USER:-yunxia}:${YUNXIA_POSTGRES_PASSWORD:-yunxia}@postgres:5432/${YUNXIA_POSTGRES_DB:-yunxia}?sslmode=disable&TimeZone=Asia%2FShanghai}"
      YUNXIA_DATABASE_AUTO_MIGRATE: "${YUNXIA_DATABASE_AUTO_MIGRATE:-true}"
      YUNXIA_DATABASE_MAX_OPEN_CONNS: "${YUNXIA_DATABASE_MAX_OPEN_CONNS:-25}"
      YUNXIA_DATABASE_MAX_IDLE_CONNS: "${YUNXIA_DATABASE_MAX_IDLE_CONNS:-5}"
      YUNXIA_DATABASE_CONN_MAX_LIFETIME: "${YUNXIA_DATABASE_CONN_MAX_LIFETIME:-1h}"
      YUNXIA_DATABASE_CONN_MAX_IDLE_TIME: "${YUNXIA_DATABASE_CONN_MAX_IDLE_TIME:-10m}"
      YUNXIA_DATABASE_SLOW_THRESHOLD: "${YUNXIA_DATABASE_SLOW_THRESHOLD:-500ms}"
      YUNXIA_STORAGE_DATA_DIR: "/app/data/storage"
      YUNXIA_STORAGE_TEMP_DIR: "/app/data/temp"
      YUNXIA_JWT_SECRET: "${YUNXIA_JWT_SECRET:-change-me-in-production}"
      YUNXIA_ARIA2_RPC_URL: "http://aria2:6800/jsonrpc"
      YUNXIA_ARIA2_RPC_SECRET: "${ARIA2_RPC_SECRET:-}"
      # 必须与 aria2 容器中的下载目录一致，并通过 backend-downloads 卷共享。
      YUNXIA_ARIA2_DOWNLOAD_DIR: "${YUNXIA_ARIA2_DOWNLOAD_DIR:-/downloads}"
      # qBittorrent 作为 BT/magnet 下载器；默认使用内部 Web API，不暴露为前端业务入口。
      # 项目内置 sidecar 默认启用 WebUI 子网白名单，账号密码留空表示后端跳过登录。
      # 如改接需要认证的外部 qBittorrent，请同时设置下面两个变量。
      YUNXIA_QBITTORRENT_ENABLED: "${YUNXIA_QBITTORRENT_ENABLED:-true}"
      YUNXIA_QBITTORRENT_API_URL: "${YUNXIA_QBITTORRENT_API_URL:-http://qbittorrent:8080}"
      YUNXIA_QBITTORRENT_USERNAME: "${YUNXIA_QBITTORRENT_USERNAME:-}"
      YUNXIA_QBITTORRENT_PASSWORD: "${YUNXIA_QBITTORRENT_PASSWORD:-}"
      # 必须与 qbittorrent 容器中的下载目录一致，并通过 backend-downloads 卷共享。
      YUNXIA_QBITTORRENT_DOWNLOAD_DIR: "${YUNXIA_QBITTORRENT_DOWNLOAD_DIR:-/downloads}"
    volumes:
      - backend-data:/app/data
      - backend-downloads:/downloads
    depends_on:
      postgres:
        condition: service_healthy
      aria2:
        condition: service_started
      qbittorrent:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  aria2:
    build:
      context: ./backend
      dockerfile: docker/aria2.Dockerfile
      # 与 backend 构建保持一致，避免 apk 访问宿主机 127.0.0.1 代理时失败。
      network: "${YUNXIA_DOCKER_BUILD_NETWORK:-host}"
      args:
        ARIA2_BASE_IMAGE: "${YUNXIA_DOCKER_ARIA2_BASE_IMAGE:-alpine:3.22}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
        NO_PROXY: "${NO_PROXY:-}"
        no_proxy: "${no_proxy:-}"
    container_name: yunxia-aria2
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      ARIA2_RPC_SECRET: "${ARIA2_RPC_SECRET:-}"
      ARIA2_RPC_PORT: "6800"
      ARIA2_LISTEN_PORT: "${ARIA2_LISTEN_PORT:-6888}"
      ARIA2_DOWNLOAD_DIR: "${YUNXIA_ARIA2_DOWNLOAD_DIR:-/downloads}"
      ARIA2_CONF_DIR: "/config"
      ARIA2_MAX_CONCURRENT_DOWNLOADS: "${ARIA2_MAX_CONCURRENT_DOWNLOADS:-5}"
    volumes:
      - aria2-config:/config
      - backend-downloads:/downloads
    ports:
      - "${ARIA2_RPC_PORT:-6800}:6800"
      - "${ARIA2_LISTEN_PORT:-6888}:6888"
      - "${ARIA2_LISTEN_PORT:-6888}:6888/udp"

  qbittorrent:
    build:
      context: ./backend
      dockerfile: docker/qbittorrent.Dockerfile
      # 与 backend/aria2 构建保持一致，便于测试机使用宿主机代理。
      network: "${YUNXIA_DOCKER_BUILD_NETWORK:-host}"
      args:
        QBITTORRENT_BASE_IMAGE: "${YUNXIA_DOCKER_QBITTORRENT_BASE_IMAGE:-alpine:3.22}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
        NO_PROXY: "${NO_PROXY:-}"
        no_proxy: "${no_proxy:-}"
    container_name: yunxia-qbittorrent
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      QBITTORRENT_CONFIG_DIR: "/config"
      QBITTORRENT_DOWNLOAD_DIR: "${YUNXIA_QBITTORRENT_DOWNLOAD_DIR:-/downloads}"
      QBITTORRENT_WEBUI_PORT: "8080"
      QBITTORRENT_LISTEN_PORT: "${QBITTORRENT_LISTEN_PORT:-6889}"
    volumes:
      - qbittorrent-config:/config
      - backend-downloads:/downloads
    ports:
      - "${QBITTORRENT_LISTEN_PORT:-6889}:6889"
      - "${QBITTORRENT_LISTEN_PORT:-6889}:6889/udp"

volumes:
  postgres-data:
  backend-data:
  backend-downloads:
  aria2-config:
  qbittorrent-config:
